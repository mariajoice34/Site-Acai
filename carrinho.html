<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrinho</title>
    <link rel="stylesheet" href="carrinho.css">
</head>
<body>

    <div class="carrinho-container">

        <h1>🛒 Seu Carrinho</h1>

        <div id="carrinho-box">
            <div id="lista-carrinho"></div>

            <div class="total-box">
                <h3>Total:</h3>
                <span>R$ <span id="total">0.00</span></span>
            </div>
<div class="dados-cliente">
    <h3>Dados para entrega</h3>

    <label>Nome:</label>
    <input type="text" id="nome-cliente" placeholder="Digite seu nome">

    <label>Endereço:</label>
    <input type="text" id="endereco-cliente" placeholder="Rua, número, bairro">

    <label>Referência:</label>
    <input type="text" id="referencia-cliente" placeholder="Ex: próximo à praça">

    <label>Forma de pagamento:</label>
    <select id="pagamento-cliente">
        <option value="">Selecione</option>
        <option value="Pix">Pix</option>
        <option value="Dinheiro">Dinheiro</option>
        <option value="Cartão de Crédito">Cartão de Crédito</option>
        <option value="Cartão de Débito">Cartão de Débito</option>
    </select>
</div>
            <div class="botoes-carrinho">
                <button class="btn-limpar" onclick="limparCarrinho()">
                    Limpar Carrinho
                </button>

                <a href="index.html" class="btn-voltar">
                    Continuar Comprando
                </a>

                <button class="btn-finalizar" onclick="finalizarPedido()">
                    Finalizar Pedido
                </button>
            </div>
        </div>

    </div>

    <script src="scripts.js"></script>
</body>
</html>
